<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img">
  <title>Future-state Frontline Driver journey</title>
  <desc>Four-stage timeline: start route, drive route, complete stop, confirm and sync. Each stage lists user action, internal state, and the pain point it addresses.</desc>
  <style>
    .th { font: 500 14px -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #26251e; }
    .ts { font: 400 12px -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #5f5e5a; }
    .tn { font: 500 14px -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #085041; }
    .box { fill: #ffffff; stroke: #b4b2a9; stroke-width: 0.5; }
    .dot { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  </style>
  <line x1="110" y1="50" x2="590" y2="50" stroke="#b4b2a9" stroke-width="1.5"/>
  <circle class="dot" cx="110" cy="50" r="14"/><text class="tn" x="110" y="50" text-anchor="middle" dominant-baseline="central">1</text>
  <circle class="dot" cx="270" cy="50" r="14"/><text class="tn" x="270" y="50" text-anchor="middle" dominant-baseline="central">2</text>
  <circle class="dot" cx="430" cy="50" r="14"/><text class="tn" x="430" y="50" text-anchor="middle" dominant-baseline="central">3</text>
  <circle class="dot" cx="590" cy="50" r="14"/><text class="tn" x="590" y="50" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="ts" x="110" y="86" text-anchor="middle">Route start</text>
  <text class="ts" x="270" y="86" text-anchor="middle">On route</text>
  <text class="ts" x="430" y="86" text-anchor="middle">At doorstep</text>
  <text class="ts" x="590" y="86" text-anchor="middle">After stop</text>

  <rect class="box" x="40" y="100" width="140" height="220" rx="8"/>
  <text class="th" x="52" y="122">Start route</text>
  <text class="ts" x="52" y="146">Action</text>
  <text class="ts" x="52" y="162">Open app; route</text>
  <text class="ts" x="52" y="176">loads offline</text>
  <text class="ts" x="52" y="200">Internal state</text>
  <text class="ts" x="52" y="216">Route cached</text>
  <text class="ts" x="52" y="230">on device</text>
  <text class="ts" x="52" y="258">Pain addressed</text>
  <text class="ts" x="52" y="274">Blank offline;</text>
  <text class="ts" x="52" y="288">crashes lose</text>
  <text class="ts" x="52" y="302">stops</text>

  <rect class="box" x="200" y="100" width="140" height="220" rx="8"/>
  <text class="th" x="212" y="122">Drive route</text>
  <text class="ts" x="212" y="146">Action</text>
  <text class="ts" x="212" y="162">Follow live,</text>
  <text class="ts" x="212" y="176">corrected route</text>
  <text class="ts" x="212" y="200">Internal state</text>
  <text class="ts" x="212" y="216">Changes pushed;</text>
  <text class="ts" x="212" y="230">overrides saved</text>
  <text class="ts" x="212" y="258">Pain addressed</text>
  <text class="ts" x="212" y="274">Stale routes;</text>
  <text class="ts" x="212" y="288">closed roads</text>

  <rect class="box" x="360" y="100" width="140" height="220" rx="8"/>
  <text class="th" x="372" y="122">One-tap stop</text>
  <text class="ts" x="372" y="146">Action</text>
  <text class="ts" x="372" y="162">One tap to</text>
  <text class="ts" x="372" y="176">complete stop</text>
  <text class="ts" x="372" y="200">Internal state</text>
  <text class="ts" x="372" y="216">Status, photo</text>
  <text class="ts" x="372" y="230">queued, retried</text>
  <text class="ts" x="372" y="258">Pain addressed</text>
  <text class="ts" x="372" y="274">Three taps;</text>
  <text class="ts" x="372" y="288">silent upload</text>
  <text class="ts" x="372" y="302">failures</text>

  <rect class="box" x="520" y="100" width="140" height="220" rx="8"/>
  <text class="th" x="532" y="122">Confirm &amp; sync</text>
  <text class="ts" x="532" y="146">Action</text>
  <text class="ts" x="532" y="162">Clear on-screen</text>
  <text class="ts" x="532" y="176">confirmation</text>
  <text class="ts" x="532" y="200">Internal state</text>
  <text class="ts" x="532" y="216">Server acks;</text>
  <text class="ts" x="532" y="230">board current</text>
  <text class="ts" x="532" y="258">Pain addressed</text>
  <text class="ts" x="532" y="274">Lagging status;</text>
  <text class="ts" x="532" y="288">shows false</text>
  <text class="ts" x="532" y="302">in progress</text>
</svg>
